[telegram]
# Replace with your Telegram API credentials from https://my.telegram.org/apps
api_id = 123456
api_hash = your_api_hash_here

[security]
# Generate a Fernet key with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
encryption_key = your_generated_fernet_key

[storage]
# Base directory for JSON database, session files and extracted usernames
root = data
